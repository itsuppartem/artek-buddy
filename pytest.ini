[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    live: installed .deb against an ephemeral compose stack
    model: Cursor/Grok turn (needs CURSOR_API_KEY; skipped on the ui job)
filterwarnings =
    ignore::DeprecationWarning
addopts = -q --tb=short
timeout = 60
timeout_method = signal
