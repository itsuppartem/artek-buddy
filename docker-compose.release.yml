# Pull published images. Secrets stay in .env (not in the image).
# Usage: ARTEK_VERSION=0.10.27 docker compose -f docker-compose.release.yml up -d

x-host: &host
  image: ghcr.io/itsuppartem/artek-buddy:${ARTEK_VERSION:?set ARTEK_VERSION}
  pull_policy: always
  restart: unless-stopped
  network_mode: host
  env_file:
    - .env

services:
  artek-buddy:
    <<: *host
    container_name: artek-buddy
    depends_on:
      memory:
        condition: service_healthy
      credential-broker:
        condition: service_healthy
      supervisor:
        condition: service_started
    environment:
      AGENT_CWD: /workspace
      AGENT_DATA_DIR: /data
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      DATABASE_URL: postgresql://artek:${MEMORY_DB_PASSWORD:?set MEMORY_DB_PASSWORD in .env}@127.0.0.1:5432/artek_buddy
      SANDBOX_SUPERVISOR_URL: http://127.0.0.1:7091
      SANDBOX_PROVIDER: docker
      COMPUTER_IMAGE: ${COMPUTER_IMAGE:?set COMPUTER_IMAGE}
      MEMORY_GATEWAY_URL: http://127.0.0.1:8420
      CREDENTIAL_BROKER_URL: http://127.0.0.1:8431
      CREDENTIAL_EXECUTOR_TOKEN: ""
      LOG_FORMAT: json
    volumes:
      # Bot credentials live only in the credential-data volume below.
      - ./workspace:/workspace
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz')",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s

  supervisor:
    <<: *host
    container_name: artek-buddy-supervisor
    environment:
      AGENT_DATA_DIR: /data
      SUPERVISOR_HOST: 127.0.0.1
      SUPERVISOR_PORT: "7091"
      COMPUTER_IMAGE: ${COMPUTER_IMAGE:?set COMPUTER_IMAGE}
      DOCKER_SOCKET: /var/run/docker.sock
      CREDENTIAL_BROKER_TOKEN: ""
      CREDENTIAL_EXECUTOR_TOKEN: ""
      LOG_FORMAT: json
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "-m", "artek_buddy", "supervisor"]

  worker:
    <<: *host
    container_name: artek-buddy-worker
    depends_on:
      artek-buddy:
        condition: service_healthy
      memory:
        condition: service_healthy
    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: postgresql://artek:${MEMORY_DB_PASSWORD:?set MEMORY_DB_PASSWORD in .env}@127.0.0.1:5432/artek_buddy
      WORKER_POLL_SECONDS: "15"
      CREDENTIAL_BROKER_TOKEN: ""
      CREDENTIAL_EXECUTOR_TOKEN: ""
      LOG_FORMAT: json
    command: ["python", "-m", "artek_buddy", "worker"]

  memory-gateway:
    <<: *host
    container_name: artek-buddy-memory-gateway
    environment:
      MEMORY_GATEWAY_HOST: 127.0.0.1
      MEMORY_GATEWAY_PORT: "8420"
      MEMORY_GATEWAY_DIR: /data/agent-memory
      CREDENTIAL_BROKER_TOKEN: ""
      CREDENTIAL_EXECUTOR_TOKEN: ""
    volumes:
      - ./data:/data
    command: ["python", "-m", "artek_buddy", "memory-gateway"]

  credential-migrator:
    image: ghcr.io/itsuppartem/artek-buddy:${ARTEK_VERSION:?set ARTEK_VERSION}
    pull_policy: always
    container_name: artek-buddy-credential-migrator
    restart: "no"
    network_mode: none
    environment:
      LEGACY_CREDENTIAL_DIR: /legacy-credentials
      CREDENTIAL_BROKER_DIR: /var/lib/artek-buddy/credentials
      LOG_FORMAT: json
    volumes:
      - ./data/credentials:/legacy-credentials
      - credential-data:/var/lib/artek-buddy/credentials
    command: ["python", "-m", "artek_buddy", "credential-migrate"]

  credential-executor:
    image: ${ARTEK_IMAGE:-ghcr.io/itsuppartem/artek-buddy:latest}
    container_name: artek-buddy-credential-executor
    restart: unless-stopped
    network_mode: host
    environment:
      AGENT_HTTP_TOKEN: ${AGENT_HTTP_TOKEN:?set AGENT_HTTP_TOKEN in .env}
      CREDENTIAL_EXECUTOR_TOKEN: ${CREDENTIAL_EXECUTOR_TOKEN:-}
      CREDENTIAL_EXECUTOR_PORT: "8432"
      CREDENTIAL_EXECUTOR_HOMES_DIR: /homes
      LOG_FORMAT: json
    volumes:
      - ./data/homes:/homes
    command: ["python", "-m", "artek_buddy", "credential-executor"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8432/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  credential-broker:
    image: ghcr.io/itsuppartem/artek-buddy:${ARTEK_VERSION:?set ARTEK_VERSION}
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    container_name: artek-buddy-credential-broker
    depends_on:
      credential-migrator:
        condition: service_completed_successfully
      credential-executor:
        condition: service_healthy
    environment:
      AGENT_HTTP_TOKEN: ${AGENT_HTTP_TOKEN:?set AGENT_HTTP_TOKEN in .env}
      CREDENTIAL_BROKER_TOKEN: ${CREDENTIAL_BROKER_TOKEN:-}
      CREDENTIAL_EXECUTOR_TOKEN: ${CREDENTIAL_EXECUTOR_TOKEN:-}
      CREDENTIAL_EXECUTOR_URL: http://127.0.0.1:8432
      CREDENTIAL_BROKER_PORT: "8431"
      CREDENTIAL_BROKER_DIR: /var/lib/artek-buddy/credentials
      LOG_FORMAT: json
    volumes:
      - credential-data:/var/lib/artek-buddy/credentials
    command: ["python", "-m", "artek_buddy", "credential-broker"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8431/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  memory:
    image: postgres:16-alpine
    container_name: artek-buddy-memory
    restart: unless-stopped
    environment:
      POSTGRES_DB: artek_buddy
      POSTGRES_USER: artek
      POSTGRES_PASSWORD: ${MEMORY_DB_PASSWORD:?set MEMORY_DB_PASSWORD in .env}
    volumes:
      - memory-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artek -d artek_buddy"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  memory-data:
  credential-data:
