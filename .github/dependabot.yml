version: 2
# Daily work is develop. main is release-only. Do not open Dependabot PRs into main.
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /client/web
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      window:
        patterns: ["*"]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    ignore:
      # Host stays Python 3.13.
      - dependency-name: python
        versions: [">=3.14"]

  - package-ecosystem: docker
    directory: /infra/computer
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
