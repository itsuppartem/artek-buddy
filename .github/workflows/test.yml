name: test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: artek_buddy_test
          POSTGRES_USER: artek
          POSTGRES_PASSWORD: artek
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artek -d artek_buddy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: src
      TEST_DATABASE_URL: postgresql://artek:artek@127.0.0.1:5432/artek_buddy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -t . -q
      - run: python tests/run_integration.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
