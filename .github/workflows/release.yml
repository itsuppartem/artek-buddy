name: release

# Publishes the GitHub Release, clean .deb, and host GHCR image.
# Does not run on push. It starts only after the `test` workflow succeeds
# on a push to main (or a manual Force run from main). A red PR into main
# cannot merge: ruleset "Protect main" requires jobs backend and ui.
# The computer image is not built here: Chromium under QEMU hangs the job.
# install-host.sh pulls it when present, otherwise builds on the Pi.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if VERSION did not change
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (
        github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Detect VERSION bump
        id: ver
        run: |
          NEW=$(tr -d '[:space:]' < VERSION)
          OLD=$(git show HEAD^:VERSION 2>/dev/null | tr -d '[:space:]' || true)
          FORCE="${{ github.event.inputs.force }}"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ -n "$NEW" ] && { [ "$NEW" != "$OLD" ] || [ "$FORCE" = "true" ]; }; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "VERSION new=$NEW old=${OLD:-none} force=${FORCE:-false}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.ver.outputs.changed == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/web/package-lock.json

      - name: Build client .deb (no baked URL)
        if: steps.ver.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          unset ARTEK_BAKE_URL
          client/build-deb.sh
          test ! -f client/url || echo "client/url exists locally but must not be baked"
          python3 - <<'PY'
          import subprocess, sys
          deb = f"artek-buddy-client_{open('VERSION').read().strip()}_all.deb"
          data = subprocess.check_output(["dpkg-deb", "-c", deb], text=True)
          if "./usr/lib/artek-buddy-client/url" in data:
              sys.exit("refusing to release a .deb that contains a baked host URL")
          print("deb has no baked url")
          PY
          cp infra/install-host.sh install-host.sh

      - name: SBOM client (CycloneDX)
        if: steps.ver.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: client
          format: cyclonedx
          output: sbom-client.cdx.json
          exit-code: "0"
          trivyignores: .trivyignore

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: steps.ver.outputs.changed == 'true'

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: steps.ver.outputs.changed == 'true'

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        if: steps.ver.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push host image
        if: steps.ver.outputs.changed == 'true'
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/itsuppartem/artek-buddy:${{ steps.ver.outputs.new }}
            ghcr.io/itsuppartem/artek-buddy:latest

      - name: Trivy host image
        if: steps.ver.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/itsuppartem/artek-buddy:${{ steps.ver.outputs.new }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore

      - name: SBOM host image (CycloneDX)
        if: steps.ver.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/itsuppartem/artek-buddy:${{ steps.ver.outputs.new }}
          format: cyclonedx
          output: sbom-host.cdx.json
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Attest client .deb
        if: steps.ver.outputs.changed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artek-buddy-client_${{ steps.ver.outputs.new }}_all.deb

      - name: Attest host image
        if: steps.ver.outputs.changed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/itsuppartem/artek-buddy
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Checksums and notes
        if: steps.ver.outputs.changed == 'true'
        run: |
          set +x
          sha256sum \
            "artek-buddy-client_${{ steps.ver.outputs.new }}_all.deb" \
            sbom-client.cdx.json \
            sbom-host.cdx.json \
            install-host.sh \
            > SHA256SUMS
          PYTHONPATH=src python3 -m artek_buddy.release_notes \
            "${{ steps.ver.outputs.new }}" CHANGELOG.md > RELEASE_NOTES.md

      - name: GitHub Release
        if: steps.ver.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.new }}"
          ASSETS=(
            "artek-buddy-client_${{ steps.ver.outputs.new }}_all.deb"
            SHA256SUMS
            sbom-client.cdx.json
            sbom-host.cdx.json
            install-host.sh
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
            echo "updated assets on $TAG"
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            "${ASSETS[@]}"

      - name: Keep five GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTEK_RELEASE_KEEP: "5"
        run: infra/prune-releases.sh
