# Ephemeral GitHub Actions stack. Do not use on the Pi.
# Do not run `docker compose config` — it prints env_file values.
services:
  artek-buddy:
    image: artek-buddy:ci
    container_name: artek-buddy
    network_mode: host
    depends_on:
      memory:
        condition: service_healthy
      credential-broker:
        condition: service_healthy
      supervisor:
        condition: service_healthy
    env_file:
      - ${ARTEK_CI_ENV}
    environment:
      AGENT_CWD: /workspace
      AGENT_DATA_DIR: /data
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      DATABASE_URL: postgresql://artek:${MEMORY_DB_PASSWORD}@127.0.0.1:5432/artek_buddy
      SANDBOX_SUPERVISOR_URL: http://127.0.0.1:7091
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-docker}
      COMPUTER_IMAGE: artek-buddy-computer:ci
      CREDENTIAL_BROKER_URL: http://127.0.0.1:8431
      CREDENTIAL_BROKER_TOKEN: ${CREDENTIAL_BROKER_TOKEN:-}
      LOG_FORMAT: json
    volumes:
      # Bot credentials live only in the ci-credential volume below.
      - ${ARTEK_CI_WORKSPACE}:/workspace
      - ${ARTEK_CI_DATA}:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  supervisor:
    image: artek-buddy:ci
    container_name: artek-buddy-supervisor
    network_mode: host
    env_file:
      - ${ARTEK_CI_ENV}
    environment:
      # Keep the supervisor view identical to the Docker host bind source.
      AGENT_DATA_DIR: ${ARTEK_CI_DATA}
      SUPERVISOR_HOST: 127.0.0.1
      SUPERVISOR_PORT: "7091"
      COMPUTER_IMAGE: artek-buddy-computer:ci
      DOCKER_SOCKET: /var/run/docker.sock
      CREDENTIAL_EXECUTOR_TOKEN: ${CREDENTIAL_EXECUTOR_TOKEN:-}
      CREDENTIAL_RUNNER_IMAGE: artek-buddy:ci
      LOG_FORMAT: json
    volumes:
      - ${ARTEK_CI_DATA}:${ARTEK_CI_DATA}
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "-m", "artek_buddy", "supervisor"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7091/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  credential-migrator:
    image: artek-buddy:ci
    container_name: artek-buddy-credential-migrator
    restart: "on-failure:3"
    network_mode: none
    environment:
      LEGACY_CREDENTIAL_DIR: /legacy-credentials
      CREDENTIAL_BROKER_DIR: /var/lib/artek-buddy/credentials
      LOG_FORMAT: json
    volumes:
      - ${ARTEK_CI_DATA}/credentials:/legacy-credentials
      - ci-credential:/var/lib/artek-buddy/credentials
    command: ["python", "-m", "artek_buddy", "credential-migrate"]

  credential-broker:
    image: artek-buddy:ci
    container_name: artek-buddy-credential-broker
    network_mode: host
    depends_on:
      credential-migrator:
        condition: service_completed_successfully
      supervisor:
        condition: service_healthy
    environment:
      AGENT_HTTP_TOKEN: ${AGENT_HTTP_TOKEN}
      CREDENTIAL_BROKER_TOKEN: ${CREDENTIAL_BROKER_TOKEN:-}
      CREDENTIAL_EXECUTOR_TOKEN: ${CREDENTIAL_EXECUTOR_TOKEN:-}
      CREDENTIAL_EXECUTOR_URL: http://127.0.0.1:7091
      CREDENTIAL_BROKER_PORT: "8431"
      CREDENTIAL_BROKER_DIR: /var/lib/artek-buddy/credentials
      LOG_FORMAT: json
    volumes:
      - ci-credential:/var/lib/artek-buddy/credentials
    command: ["python", "-m", "artek_buddy", "credential-broker"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8431/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  memory:
    image: postgres:16-alpine
    container_name: artek-buddy-memory
    environment:
      POSTGRES_DB: artek_buddy
      POSTGRES_USER: artek
      POSTGRES_PASSWORD: ${MEMORY_DB_PASSWORD}
    volumes:
      - ci-memory:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artek -d artek_buddy"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  ci-memory:
  ci-credential:
